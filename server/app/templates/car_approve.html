{% extends "base.html" %}
{% block body %}
{% if error %}
<p class="error">{{ error }}</p>
{% else %}
<p>{{ user.display_name }}님 계정으로 차에서 로그인할까요?</p>
<div class="card">
  <p class="small">기기: {{ device or "Pleos Connect 차량" }}</p>
  <form method="post"><input type="hidden" name="code" value="{{ code }}"><button type="submit">이 차에서 로그인</button></form>
</div>
<p class="small">내 계정이 아니면 <a href="/m/logout?next={{ next | urlencode }}">다른 계정으로 로그인</a></p>
{% endif %}
{% endblock %}
