{# 선 아이콘 세트 (외부 라이브러리 없음). 색은 글자색(currentColor)을 따른다. 장식이라 스크린리더에는 숨긴다. #}
{% macro icon(name, size=24) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

{%- elif name == "care" %}<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>
{%- elif name == "grow" %}<path d="M12 21v-8"/><path d="M12 13c0-3.3-2.5-5.5-6-5.5 0 3.3 2.5 5.5 6 5.5z"/><path d="M12 11c0-3 2.2-5.2 6-5.2 0 3-2.2 5.2-6 5.2z"/>
{%- elif name == "my" %}<circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/>
{%- elif name == "sliders" %}<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
{%- elif name == "route" %}<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/>
{%- elif name == "car" %}<path d="M5 16v-5l2-5h10l2 5v5"/><path d="M3 16h18v2.5H3z"/><circle cx="8" cy="18.5" r="1.2"/><circle cx="16" cy="18.5" r="1.2"/><path d="M5.5 11h13"/>
{%- elif name == "bottle" %}<path d="M10 3h4v3h-4z"/><path d="M9 6h6l1 3v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9z"/><path d="M9 13h3M9 16h3"/>
{%- elif name == "moon" %}<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "chevron" %}<path d="M9 5l7 7-7 7"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "qr" %}<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h3v3h-3zM20 14v6h-4"/>
{%- elif name == "pin" %}<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>
{%- elif name == "baby" %}<circle cx="12" cy="11" r="7"/><path d="M9.5 10.5h.01M14.5 10.5h.01"/><path d="M10 14c.6.7 1.2 1 2 1s1.4-.3 2-1"/><path d="M12 4c1.2-1 2.6-1 3.5 0"/>
{%- endif -%}
</svg>
{%- endmacro %}
