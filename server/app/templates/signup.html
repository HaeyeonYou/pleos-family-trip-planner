{% extends "base.html" %}
{% block body %}
<p>가족 정보와 나들이 기록을 차와 폰에서 함께 쓰려면 계정이 필요해요.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="card">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="display_name">이름(별명)</label>
  <input id="display_name" name="display_name" maxlength="30" value="{{ display_name }}">
  <label for="login_id">아이디 (영문 소문자·숫자·밑줄 4~20자)</label>
  <input id="login_id" name="login_id" autocomplete="username" autocapitalize="none" value="{{ login_id }}" required>
  <label for="password">비밀번호 (8자 이상)</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <button type="submit">가입하고 시작하기</button>
</form>
<p class="small">이미 계정이 있나요? <a href="/m/login?next={{ next | urlencode }}">로그인</a></p>
{% endblock %}
