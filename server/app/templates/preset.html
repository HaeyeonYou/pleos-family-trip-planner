{% extends "base.html" %}
{% block body %}
<p>정해 두고 '차로 보내기'를 누르면, 시동 후 차 앱을 켰을 때 이 설정을 확인하고 바로 적용할 수 있어요.</p>
{% if status %}<p class="{{ 'error' if error else '' }}">{{ status }}</p>{% endif %}
<form method="post" class="card">
  <label for="name">설정 이름</label>
  <input id="name" name="name" maxlength="30" value="{{ s.name }}">

  <label for="temperature">온도 <span id="temp_out">{{ s.temperature }}</span>°C</label>
  <input id="temperature" name="temperature" type="range" min="16" max="30" step="0.5" value="{{ s.temperature }}"
         oninput="temp_out.textContent=this.value">

  <label for="fan_speed">풍량 <span id="fan_out">{{ s.fan_speed }}</span>단</label>
  <input id="fan_speed" name="fan_speed" type="range" min="1" max="8" step="1" value="{{ s.fan_speed }}"
         oninput="fan_out.textContent=this.value">

  {% for key, label in seats %}
  <label for="{{ key }}">{{ label }} <span id="{{ key }}_out">{{ '끔' if s[key] == 0 else s[key] ~ '단' }}</span></label>
  <input id="{{ key }}" name="{{ key }}" type="range" min="0" max="3" step="1" value="{{ s[key] }}"
         oninput="{{ key }}_out.textContent = this.value == 0 ? '끔' : this.value + '단'">
  {% endfor %}

  {% for key, label in toggles %}
  <label class="check"><input type="checkbox" name="{{ key }}" value="1" {{ 'checked' if s[key] }}> {{ label }}</label>
  {% endfor %}
  <button type="submit">차로 보내기</button>
</form>
<a class="button secondary" href="/m/">처음으로</a>
<style>
  input[type=range] { padding:0; accent-color: var(--primary); }
  label.check { display:flex; gap:10px; align-items:center; color:var(--text); font-size:17px; margin-top:16px; }
  label.check input { width:22px; height:22px; }
</style>
{% endblock %}
