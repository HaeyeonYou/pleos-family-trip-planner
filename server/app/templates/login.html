{% extends "base.html" %}
{% from "_auth.html" import tabs %}
{% block body %}
{{ tabs('login', next) }}
{% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field" for="login_id">아이디</label>
  <input id="login_id" name="login_id" type="text" autocomplete="username" autocapitalize="none" value="{{ login_id }}" required>
  <label class="field" for="password">비밀번호</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">로그인</button>
</form>
{% endblock %}
