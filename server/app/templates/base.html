<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>{{ title }} · 오늘, 어디 가지?</title>
<link rel="stylesheet" href="/m/assets/m.css">
</head>
<body class="{{ 'with-tabs' if tab }}">
<div class="app">
<main class="page">
{% block header %}<h1 class="title">{{ title }}</h1>{% endblock %}
{% block body %}{% endblock %}
</main>
{% if tab %}
<nav class="tabbar" aria-label="주 메뉴">
  {% for key, label, href in [("home", "홈", "/m/"), ("care", "케어", "/m/care"), ("grow", "그로우", "/m/grow"), ("my", "MY", "/m/my")] %}
  <a href="{{ href }}"{% if tab == key %} aria-current="page"{% endif %}><span class="shape{{ ' round' if key == 'my' }}" aria-hidden="true"></span>{{ label }}</a>
  {% endfor %}
</nav>
{% endif %}
</div>
</body>
</html>
