<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · 오늘, 어디 가지?</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2430; --muted:#5d6878; --primary:#244a5f; --error:#b3261e; --line:#d7dce3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1e232b; --text:#e9edf2; --muted:#a3adba; --primary:#8fc1dd; --error:#f2b8b5; --line:#343b46; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:420px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:14px; font-size:17px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  button, .button { display:block; width:100%; margin-top:20px; padding:15px; font-size:17px; font-weight:600; border:0; border-radius:12px; background:var(--primary); color:var(--card); text-align:center; text-decoration:none; }
  .secondary { background:transparent; color:var(--primary); border:1px solid var(--line); }
  .error { color:var(--error); font-weight:600; }
  .small { font-size:14px; }
  a { color:var(--primary); }
</style>
</head>
<body><main>
<h1>{{ title }}</h1>
{% block body %}{% endblock %}
</main></body>
</html>
