# NAS(Synology Container Manager) 운영용. 로그는 /volume1/docker/pleos/logs (File Station: docker/pleos/logs). 비밀값은 저장소 밖 ../.env에 둔다 (tools/deploy_nas.sh 참고).
#   sudo docker compose --env-file ../.env -p pleos up -d --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pleos
      POSTGRES_USER: pleos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?../.env에 POSTGRES_PASSWORD(영문·숫자)를 넣어 주세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pleos -d pleos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: &docker-log
      # Docker 자체 로그는 최근 것만 (오래 볼 로그는 LOG_DIR 파일)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pleos:${POSTGRES_PASSWORD}@db:5432/pleos
      PARSER: ${PARSER:-auto}
      DEMO_MODE: ${DEMO_MODE:-false}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
      # DSM 리버스 프록시(HTTPS)가 붙인 X-Forwarded-* 를 믿는다 (컨테이너에는 Docker 게이트웨이 주소로 들어온다)
      FORWARDED_ALLOW_IPS: "*"
      # 서버 로그(server.log)·앱 크래시(app-YYYY-MM-DD.jsonl)를 남길 곳과 보관 일수 (#261)
      LOG_DIR: /logs
      LOG_KEEP_DAYS: ${LOG_KEEP_DAYS:-30}
    volumes:
      - ${LOG_HOST_DIR:-/volume1/docker/pleos/logs}:/logs
    logging: *docker-log
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
